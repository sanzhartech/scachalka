name: Release

# Publishes a portable, self-contained Scachalka.exe whenever a v* tag is pushed.
# Create a release with:  git tag v1.1.0 && git push origin v1.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test --configuration Release

      - name: Publish portable single-file exe
        run: >
          dotnet publish src/YtDlpGui.App/YtDlpGui.App.csproj
          -c Release -r win-x64 --self-contained true
          -o publish

      - name: Stage release artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item publish/Scachalka.exe artifact/Scachalka.exe
          Copy-Item README.md artifact/README.md
          Copy-Item LICENSE artifact/LICENSE
          Compress-Archive -Path artifact/* -DestinationPath "Scachalka-${{ github.ref_name }}-win-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Scachalka ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            publish/Scachalka.exe
            Scachalka-${{ github.ref_name }}-win-x64.zip
